  <line x1="232" y1="194" x2="928" y2="194" stroke="#D97757" stroke-width="1.4"/>

  <text x="232" y="234" font-family="Georgia,'Times New Roman',serif" font-size="21" fill="#B3AA9C">Small web things that keep my own data on my own machine.</text>
  <text x="232" y="268" font-family="Georgia,'Times New Roman',serif" font-size="21" fill="#B3AA9C">Essays in Chinese on cities, calendars and anything countable.</text>

