<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="t d">
  <title id="t">Yaoyu Han — personal archive, index card no. 001</title>
  <desc id="d">An index card lying on dark warm paper, with the name Yaoyu Han and a short line about small local-first web things.</desc>

  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#2E281F"/>
    </pattern>
  </defs>

  <rect width="1200" height="400" fill="#1A1814"/>
  <rect width="1200" height="400" fill="url(#dots)" opacity="0.7"/>

  <g transform="rotate(2.2 620 200)">
