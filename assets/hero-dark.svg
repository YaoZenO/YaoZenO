<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="t d">
  <title id="t">Yaoyu Han</title>
  <desc id="d">A masthead: the name in a large serif on the left, a short note in a narrow column on the right, and hairlines above and below.</desc>

  <text x="0" y="22" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="15" letter-spacing="4" fill="#8C8272">040925.XYZ</text>
  <text x="1200" y="22" text-anchor="end" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="15" letter-spacing="4" fill="#8C8272">SHANGHAI, CHINA</text>

  <line x1="0" y1="46" x2="1200" y2="46" stroke="#3A342B" stroke-width="1"/>

  <text x="0" y="200" font-family="Georgia,'Times New Roman',serif" font-size="118"
        letter-spacing="-2.5" fill="#E6DFD3">Yaoyu</text>
  <text x="0" y="300" font-family="Georgia,'Times New Roman',serif" font-size="118"
        letter-spacing="-2.5" fill="#E6DFD3">Han</text>

  <line x1="770" y1="120" x2="770" y2="300" stroke="#3A342B" stroke-width="1"/>

  <text x="806" y="152" font-family="Georgia,'Times New Roman',serif" font-size="20" fill="#B0A797">Small tools that keep my own</text>
  <text x="806" y="182" font-family="Georgia,'Times New Roman',serif" font-size="20" fill="#B0A797">data on my own machine.</text>
  <text x="806" y="230" font-family="Georgia,'Times New Roman',serif" font-size="20" fill="#B0A797">Essays on cities, calendars,</text>
  <text x="806" y="260" font-family="Georgia,'Times New Roman',serif" font-size="20" fill="#B0A797">and anything else countable.</text>

  <rect x="0" y="336" width="200" height="3" fill="#D97757"/>

  <line x1="0" y1="384" x2="1200" y2="384" stroke="#3A342B" stroke-width="1" stroke-dasharray="3 7"/>
  <text x="0" y="412" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="15" letter-spacing="3.4" fill="#8C8272">INDEX NO. 001</text>
  <text x="1200" y="412" text-anchor="end" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="15" letter-spacing="3.4" fill="#8C8272">EST. 2023</text>
</svg>
