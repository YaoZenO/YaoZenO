<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="t d">
  <title id="t">Yaoyu Han — personal archive, index card no. 001</title>
  <desc id="d">An index card lying on warm paper, with the name Yaoyu Han and a short line about small local-first web things, in the colours of 040925.xyz.</desc>

  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#E8DECB"/>
    </pattern>
  </defs>

  <rect width="1200" height="400" fill="#FAF6EE"/>
  <rect width="1200" height="400" fill="url(#dots)" opacity="0.55"/>

  <!-- card behind, slightly rotated -->
  <g transform="rotate(2.2 620 200)">
    <rect x="236" y="76" width="790" height="272" rx="3" fill="#F1E9DA" stroke="#E2D8C6"/>
  </g>

  <!-- soft shadow -->
  <rect x="206" y="76" width="800" height="280" rx="3" fill="#E8DECB" opacity="0.5"/>

  <!-- front card -->
  <rect x="200" y="60" width="800" height="280" rx="3" fill="#FFFCF6" stroke="#E2D8C6"/>

  <!-- folder tab -->
  <path d="M200 42 a6 6 0 0 1 6 -6 h80 a6 6 0 0 1 6 6 v20 h-92 z" fill="#A8482C"/>
  <text x="246" y="55" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="11" letter-spacing="2"
        fill="#FFFCF6" text-anchor="middle">001</text>

  <!-- header -->
  <text x="232" y="98" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="13"
        letter-spacing="3.6" fill="#8A7F6D">PERSONAL ARCHIVE</text>
  <text x="928" y="98" text-anchor="end" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="13"
        letter-spacing="3.6" fill="#8A7F6D">EST. 2023</text>

  <text x="230" y="170" font-family="Georgia,'Times New Roman','Songti SC',serif" font-size="56"
        letter-spacing="-1" fill="#1B1712">Yaoyu Han</text>
  <text x="928" y="166" text-anchor="end" font-family="Georgia,'Times New Roman','Songti SC','Noto Serif CJK SC',serif"
        font-size="25" fill="#A8482C">韩耀宇</text>

  <line x1="232" y1="194" x2="928" y2="194" stroke="#A8482C" stroke-width="1.4"/>

  <!-- body -->
  <text x="232" y="234" font-family="Georgia,'Times New Roman',serif" font-size="21" fill="#5A5247">Small web things that keep my own data on my own machine.</text>
  <text x="232" y="268" font-family="Georgia,'Times New Roman',serif" font-size="21" fill="#5A5247">Essays in Chinese on cities, calendars and anything countable.</text>

  <line x1="232" y1="296" x2="928" y2="296" stroke="#E2D8C6" stroke-dasharray="2 5"/>

  <text x="232" y="322" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="12.5"
        letter-spacing="2.6" fill="#8A7F6D">SHANGHAI, CHINA</text>
  <text x="928" y="322" text-anchor="end" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="12.5"
        letter-spacing="2.6" fill="#8A7F6D">040925.XYZ</text>
</svg>
